<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING COIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; user-select: none; margin: 0; padding: 15px; }
        .score { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .energy { color: #00ffcc; font-size: 16px; margin-bottom: 15px; }
        .coin-btn { background: none; border: none; outline: none; cursor: pointer; padding: 0; }
        .coin-btn img { width: 180px; height: 180px; transition: transform 0.05s; }
        .coin-btn:active img { transform: scale(0.92); }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .tab-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #ffcc00; color: #000; font-weight: bold; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: #222; border-radius: 10px; padding: 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
        .btn-buy { background: #ffcc00; color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="score">👑 <span id="balance">0</span></div>
    <div class="energy">⚡ Energy: <span id="energy">10</span> / <span id="max_energy">10</span></div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('game')">Game</button>
        <button class="tab-btn" onclick="switchTab('tasks')">Tasks</button>
    </div>

    <div id="tab-game" class="section active">
        <button class="coin-btn" id="tapBtn">
            <img src="king_coin.png" alt="KING COIN">
        </button>
    </div>

    <div id="tab-tasks" class="section">
        <h3>Tasks</h3>
        <div id="tasks-list">Loading...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;
        const SERVER_URL = "http://127.0.0.1:8000"; // або адреса твоего сервера

        let balance = 0, energy = 10, maxEnergy = 10;

        async function loadUserData() {
            try {
                const res = await fetch(`${SERVER_URL}/api/user/${userId}`);
                const data = await res.json();
                balance = data.balance;
                energy = data.energy;
                maxEnergy = data.max_energy;
                updateUI();
            } catch(e) {}
        }

        async function saveData() {
            try {
                await fetch(`${SERVER_URL}/api/save`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, balance, energy, max_energy: maxEnergy })
                });
            } catch(e) {}
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('energy').innerText = energy;
            document.getElementById('max_energy').innerText = maxEnergy;
        }

        document.getElementById('tapBtn').addEventListener('click', () => {
            if (energy > 0) {
                balance++;
                energy--;
                updateUI();
                saveData();
            }
        });

        async function loadTasks() {
            try {
                const res = await fetch(`${SERVER_URL}/api/tasks`);
                const tasks = await res.json();
                const list = document.getElementById('tasks-list');
                list.innerHTML = '';
                tasks.forEach(task => {
                    list.innerHTML += `
                        <div class="card">
                            <div>
                                <strong>${task.title}</strong><br>
                                <small>Reward: +${task.reward} 🪙</small>
                            </div>
                            <a class="btn-buy" href="${task.link}" target="_blank" onclick="claimTask(${task.reward})">Join & Claim</a>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        function claimTask(reward) {
            balance += reward;
            updateUI();
            saveData();
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if(tab === 'tasks') loadTasks();
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUI();
            }
        }, 3000);

        loadUserData();
    </script>
</body>
</html>
