<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING COIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; user-select: none; margin: 0; padding: 20px; }
        .score { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .energy { color: #00ffcc; font-size: 18px; margin-bottom: 20px; }
        .coin-btn { background: none; border: none; outline: none; cursor: pointer; padding: 0; }
        .coin-btn img { width: 220px; height: 220px; transition: transform 0.05s; }
        .coin-btn:active img { transform: scale(0.92); }
        .btn-upgrade { background: #ffcc00; border: none; padding: 12px 24px; font-weight: bold; border-radius: 10px; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="score">👑 <span id="balance">0</span></div>
    <div class="energy">⚡ Енергія: <span id="energy">10</span> / <span id="max_energy">10</span></div>

    <button class="coin-btn" id="tapBtn">
        <img src="king_coin.png" alt="KING COIN">
    </button>

    <div>
        <button class="btn-upgrade" id="boostBtn">⚡ Boost Energy (+5 max) [500 🪙]</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 12345;

        let balance = 0, energy = 10, maxEnergy = 10;

        async function loadData() {
            try {
                const res = await fetch(`https://твій-сервер.com/api/user/${userId}`);
                const data = await res.json();
                balance = data.balance; energy = data.energy; maxEnergy = data.max_energy;
                updateUI();
            } catch(e) {}
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('energy').innerText = energy;
            document.getElementById('max_energy').innerText = maxEnergy;
        }

        document.getElementById('tapBtn').addEventListener('click', async () => {
            if (energy > 0) {
                balance++; energy--;
                updateUI();
                await fetch(`https://твій-сервер.com/api/tap`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
            }
        });

        // Таймер відновлення енергії (+1 кожні 3 сек)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUI();
            }
        }, 3000);

        loadData();
    </script>
</body>
</html>
